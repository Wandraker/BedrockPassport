name: Publish BedrockPassport 1.3.8

on:
  push:
    branches:
      - main
    paths:
      - 'build.gradle.kts'
      - '.github/workflows/release-1.3.8.yml'

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Release BedrockPassport 1.3.8'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build
        run: gradle clean build --stacktrace

      - name: Prepare release assets
        run: |
          git archive --format=zip --output=BedrockPassport-1.3.8-source.zip HEAD
          sha256sum build/libs/BedrockPassport-1.3.8.jar BedrockPassport-1.3.8-source.zip > BedrockPassport-1.3.8.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## BedrockPassport 1.3.8

          Fixes a LOCAL identity safety issue where username letter-case variants could resolve to different offline UUIDs while AuthMe treated them as the same account.

          ### Fixed

          - Added canonical LOCAL username resolution before offline UUID generation.
          - When AuthMe already has a registered account, its stored real-name casing is authoritative.
          - Existing saved Passport identities are canonicalized on selection before the backend login is created.
          - New LOCAL shortcuts reuse an existing case-insensitive Passport spelling when no AuthMe registration exists yet.
          - LOCAL canonical-name claims are serialized through the Passport database so simultaneous case-variant selections cannot create separate UUID identities.
          - Added AuthMe soft-load ordering and runtime API integration without making AuthMe a hard dependency.
          - Existing stale playerdata or permission records under previously generated wrong UUIDs are not deleted automatically.

          This changes only LOCAL/offline identity canonicalization. JAVA_ACCOUNT behavior is unchanged.
          EOF

          gh release create v1.3.8 \
            build/libs/BedrockPassport-1.3.8.jar \
            BedrockPassport-1.3.8-source.zip \
            BedrockPassport-1.3.8.sha256 \
            --repo Wandraker/BedrockPassport \
            --target "${GITHUB_SHA}" \
            --title "BedrockPassport 1.3.8" \
            --notes-file release-notes.md

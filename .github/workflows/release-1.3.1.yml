name: Publish BedrockPassport 1.3.1

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/release-1.3.1.yml'

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Publish BedrockPassport 1.3.1'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release source
        uses: actions/checkout@v5
        with:
          ref: 525099623f8c15abc096ba599ea3d1a5fd792bdc

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build 1.3.1
        run: gradle clean build --stacktrace

      - name: Prepare release asset
        run: cp build/libs/BedrockPassport-1.3.1.jar BedrockPassport-1.3.1.jar

      - name: Write release notes
        run: |
          cat > release-notes.md <<'EOF'
          ## BedrockPassport 1.3.1

          BedrockPassport 1.3.1 improves the localization system introduced in 1.3.0 and fixes configuration migration for existing installations.

          ### Automatic player language

          - Added automatic Bedrock client language detection for player-facing Passport forms and disconnect messages.
          - Locale selection is scoped per connection, so players using different client languages can receive different Passport interfaces at the same time.
          - Added `language.use-player-locale`.
          - Added configurable `language.player-locale-fallback`.
          - Disabling automatic detection preserves the previous `language.messages` behavior.
          - Regional variants are matched by language family where possible.

          ### New player-facing locales

          - `en_US` — English
          - `ru_RU` — Русский
          - `uk_UA` — Українська
          - `de_DE` — Deutsch
          - `es_ES` — Español

          English and Russian remain the full administrator/config localizations. Ukrainian, German and Spanish currently focus on the player-facing Passport flow and fall back to English for untranslated administrator or console keys.

          ### LOCAL and JAVA_ACCOUNT coverage

          Per-player localization now applies to both identity providers, including account selectors, management forms, LOCAL identity creation, JAVA_ACCOUNT sign-in and re-authentication, allowlist denial messages, timeout/reconnect messages, duplicate-session protection, and fail-closed LOCAL handoff messages.

          ### Configuration schema v4

          New settings:

          ```yaml
          language:
            config: en_US
            messages: en_US
            use-player-locale: true
            player-locale-fallback: en_US
          ```

          ### Config migration fix

          - Fixed existing `config.yml` files not receiving newly introduced settings after plugin updates.
          - The migrator now distinguishes values actually stored in the user's config from bundled defaults.
          - Missing settings and sections are written automatically.
          - Existing administrator-defined values are preserved.
          - `config-version` is correctly persisted into the user's config.
          - Legacy timeout migration now checks the real saved configuration.
          - Configuration comments continue to be regenerated using `language.config`.

          Existing installations should no longer need to delete or recreate `config.yml` to receive new settings.

          ### Administration

          `/bp status` now also reports whether automatic player language detection is enabled and the configured player-language fallback.

          ### Runtime verification

          Automatic player localization and the updated configuration migration flow were runtime-tested successfully.
          EOF

      - name: Publish GitHub release once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v1.3.1 >/dev/null 2>&1; then
            echo "v1.3.1 already exists; refusing to create a duplicate release."
            exit 0
          fi
          gh release create v1.3.1 \
            BedrockPassport-1.3.1.jar \
            --repo Wandraker/BedrockPassport \
            --target 525099623f8c15abc096ba599ea3d1a5fd792bdc \
            --title "BedrockPassport 1.3.1" \
            --notes-file release-notes.md

name: Publish BedrockPassport 1.3.4

on:
  push:
    branches:
      - main
    paths:
      - 'build.gradle.kts'
      - '.github/workflows/release-1.3.4.yml'

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Release BedrockPassport 1.3.4'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build
        run: gradle clean build --stacktrace

      - name: Prepare release assets
        run: |
          git archive --format=zip --output=BedrockPassport-1.3.4-source.zip HEAD
          sha256sum build/libs/BedrockPassport-1.3.4.jar BedrockPassport-1.3.4-source.zip > BedrockPassport-1.3.4.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## BedrockPassport 1.3.4

          Fixes Passport-managed Bedrock skins being lost or overwritten after the LOCAL identity handoff.

          ### Fixed

          - Real Floodgate/Bedrock skin data now takes priority for Passport-managed LOCAL identities.
          - Gallery/custom Bedrock skins are no longer rejected merely because the selected Java identity already has a texture.
          - Floodgate placeholder/default skin data is still ignored as a real player skin.
          - SkinsRestorer no longer overwrites a real Bedrock skin during the same join.
          - SkinsRestorer remains a fallback when no real Bedrock skin is available.
          - The accepted skin is applied through Floodgate's Java-side profile path, allowing other Java and Bedrock players to see it.

          No authentication, identity, UUID or JAVA_ACCOUNT behavior is changed.
          EOF

          gh release create v1.3.4 \
            build/libs/BedrockPassport-1.3.4.jar \
            BedrockPassport-1.3.4-source.zip \
            BedrockPassport-1.3.4.sha256 \
            --repo Wandraker/BedrockPassport \
            --target "${GITHUB_SHA}" \
            --title "BedrockPassport 1.3.4" \
            --notes-file release-notes.md

name: Publish BedrockPassport 1.3.3

on:
  push:
    branches:
      - main
    paths:
      - 'build.gradle.kts'
      - '.github/workflows/release-1.3.3.yml'

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Release BedrockPassport 1.3.3'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build
        run: gradle clean build --stacktrace

      - name: Prepare release assets
        run: |
          git archive --format=zip --output=BedrockPassport-1.3.3-source.zip HEAD
          sha256sum build/libs/BedrockPassport-1.3.3.jar BedrockPassport-1.3.3-source.zip > BedrockPassport-1.3.3.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## BedrockPassport 1.3.3

          Hardens the LOCAL/Floodgate identity handoff against stale position packets during the transition from the Bedrock holding environment to the real Java player session.

          ### Fixed

          - Adds a short-lived initial movement guard before Geyser's downstream translator.
          - Position-bearing Java movement packets are suppressed only until the backend sends the first real player-position packet.
          - The guard removes itself before Geyser processes that first position, so Geyser's normal teleport acknowledgement is left untouched.
          - The guard fails open if Geyser/MCProtocolLib internals change instead of blocking Bedrock login.
          - No Paper movement thresholds or anti-cheat protections are disabled.
          - JAVA_ACCOUNT behavior is unchanged.

          This is a defensive handoff fix for repeated `moved too quickly` bursts observed immediately after LOCAL Bedrock joins. Auth plugins that freeze unauthenticated movement can still independently produce similar warnings.
          EOF

          gh release create v1.3.3 \
            build/libs/BedrockPassport-1.3.3.jar \
            BedrockPassport-1.3.3-source.zip \
            BedrockPassport-1.3.3.sha256 \
            --repo Wandraker/BedrockPassport \
            --target "${GITHUB_SHA}" \
            --title "BedrockPassport 1.3.3" \
            --notes-file release-notes.md

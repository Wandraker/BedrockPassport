name: Publish BedrockPassport 1.3.6

on:
  push:
    branches:
      - main
    paths:
      - 'build.gradle.kts'
      - '.github/workflows/release-1.3.6.yml'

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Release BedrockPassport 1.3.6'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build
        run: gradle clean build --stacktrace

      - name: Prepare release assets
        run: |
          git archive --format=zip --output=BedrockPassport-1.3.6-source.zip HEAD
          sha256sum build/libs/BedrockPassport-1.3.6.jar BedrockPassport-1.3.6-source.zip > BedrockPassport-1.3.6.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## BedrockPassport 1.3.6

          Fixes Bedrock gallery/custom skins being visible in the Passport holding environment but disappearing after the selected LOCAL identity reaches the Java backend.

          ### Fixed

          - BedrockPassport now explicitly requests Geyser's native Floodgate skin upload immediately after a LOCAL Passport identity is selected.
          - The upload is requested while Geyser still retains the original Bedrock client data and authentication chain/token.
          - The resulting skin still travels through Geyser/Floodgate's normal signed texture pipeline.
          - The existing skin-event protection remains in place so SkinsRestorer cannot replace the original Bedrock texture during that upload.
          - Diagnostics now report when Geyser's skin uploader, original client data, or Bedrock authentication data are unavailable.

          No authentication, identity UUID or JAVA_ACCOUNT behavior is changed.
          EOF

          gh release create v1.3.6 \
            build/libs/BedrockPassport-1.3.6.jar \
            BedrockPassport-1.3.6-source.zip \
            BedrockPassport-1.3.6.sha256 \
            --repo Wandraker/BedrockPassport \
            --target "${GITHUB_SHA}" \
            --title "BedrockPassport 1.3.6" \
            --notes-file release-notes.md

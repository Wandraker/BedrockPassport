name: Publish BedrockPassport 1.3.2

on:
  push:
    branches:
      - main
    paths:
      - 'build.gradle.kts'
      - '.github/workflows/release-1.3.2.yml'

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Release BedrockPassport 1.3.2'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build
        run: gradle clean build --stacktrace

      - name: Prepare checksum
        run: sha256sum build/libs/BedrockPassport-1.3.2.jar > BedrockPassport-1.3.2.jar.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## BedrockPassport 1.3.2

          Fixes LOCAL/offline Bedrock sessions being disconnected with `Geyser passport holding world initialization timed out` while waiting for the Bedrock client to finish holding-world initialization.

          ### Fixed

          - LOCAL mode no longer waits for `UpstreamSession.isInitialized()` before opening the Passport selector.
          - Passport forms are queued through Geyser's own form cache and are sent when the Bedrock client finishes initialization.
          - Slow or delayed `SetLocalPlayerAsInitializedPacket` responses no longer trigger the old 10-second LOCAL-mode disconnect.
          - `compatibility.holding-world-init-timeout-seconds` now applies only to the JAVA_ACCOUNT flow.
          - JAVA_ACCOUNT/online-mode behavior is unchanged.

          This release targets Minecraft 26.2 / Java 25 and supports Paper, Purpur, Leaf and Folia as documented by the project.
          EOF

          gh release create v1.3.2             build/libs/BedrockPassport-1.3.2.jar             BedrockPassport-1.3.2.jar.sha256             --repo Wandraker/BedrockPassport             --target "${GITHUB_SHA}"             --title "BedrockPassport 1.3.2"             --notes-file release-notes.md

name: Edit BedrockPassport 1.3.1 release notes

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/edit-release-1.3.1.yml'

permissions:
  contents: write

jobs:
  edit:
    if: github.event.head_commit.message == 'Edit BedrockPassport 1.3.1 release notes'
    runs-on: ubuntu-latest
    steps:
      - name: Write consolidated release notes
        run: |
          cat > release-notes.md <<'EOF'
          ## BedrockPassport 1.3.1

          BedrockPassport 1.3.1 brings the new Bedrock access-control and localization system together with automatic per-player language selection and safer configuration migration.

          ### 🔐 Bedrock/Xbox access allowlist

          - Added an optional Bedrock allowlist.
          - Access can be granted by real Xbox/Bedrock gamertag or XUID.
          - Gamertag matching is case-insensitive.
          - The allowlist is checked before the Passport selector and before backend player creation.
          - The check uses the real Bedrock/Xbox identity, so switching to another saved Java identity cannot bypass it.
          - Java clients are not affected.
          - Enabling the allowlist with no configured players or XUIDs denies all Bedrock connections and can be used as a temporary Bedrock maintenance mode.

          ### 🌍 Localization

          - Added the BedrockPassport localization system.
          - Added full built-in `en_US` and `ru_RU` localization for player messages, Bedrock forms, administration output, operational messages and configuration comments.
          - Added player-facing `uk_UA`, `de_DE` and `es_ES` locale packs.
          - Added automatic Bedrock client language detection for player-facing Passport flows.
          - Locale selection is scoped per connection, so players using different client languages can receive different Passport interfaces at the same time.
          - Added `language.use-player-locale`.
          - Added configurable `language.player-locale-fallback`.
          - Regional variants are matched by language family where possible, such as `en_GB → en_US` and `es_MX → es_ES`.
          - Disabling automatic player-language detection preserves the previous `language.messages` behavior.
          - Added `messages.overrides` for changing individual messages without copying an entire locale.
          - `language.config` and `language.messages` remain separate, so configuration comments and runtime/admin messages can use different default languages.

          ### 🪪 LOCAL and JAVA_ACCOUNT coverage

          The localization and Bedrock access systems are wired through both identity providers, including:

          - LOCAL identity creation and account selection;
          - JAVA_ACCOUNT selection, Microsoft sign-in and re-authentication;
          - account-management and removal forms;
          - allowlist denial messages;
          - timeout and reconnect messages;
          - duplicate-session and session-protection messages;
          - fail-closed LOCAL identity handoff messages.

          ### ⚙️ Configuration schema and migration

          The configuration schema is now **v4**.

          Current language settings:

          ```yaml
          language:
            config: en_US
            messages: en_US
            use-player-locale: true
            player-locale-fallback: en_US
          ```

          - Existing configurations are migrated automatically.
          - Missing settings and sections are added from the bundled configuration while existing administrator-defined values are preserved.
          - Fixed an issue where bundled defaults could make the migrator incorrectly believe that new settings were already present in an older `config.yml`.
          - `config-version` is now correctly persisted into the user's configuration.
          - Legacy timeout migration now checks the real saved configuration instead of bundled defaults.
          - Older customized UI text is migrated into `messages.overrides` where possible.
          - Configuration comments are regenerated using `language.config` without replacing existing values.
          - Existing installations should not need to delete or recreate `config.yml` to receive new settings.

          ### 🛠 Administration

          - `/bp status` now reports Bedrock allowlist state and entry counts.
          - `/bp status` reports configured languages, automatic player-language state, player-language fallback and configuration schema.
          - `/bp who` output is localized.
          - Remaining administration responses were moved into the localization system.

          ### ✅ Runtime verification

          Automatic per-player localization and the updated configuration migration flow were runtime-tested successfully.
          EOF

      - name: Edit existing GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release edit v1.3.1 \
            --repo Wandraker/BedrockPassport \
            --title "BedrockPassport 1.3.1" \
            --notes-file release-notes.md

name: Publish BedrockPassport 1.3.5

on:
  push:
    branches:
      - main
    paths:
      - 'build.gradle.kts'
      - '.github/workflows/release-1.3.5.yml'

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Release BedrockPassport 1.3.5'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build
        run: gradle clean build --stacktrace

      - name: Prepare release assets
        run: |
          git archive --format=zip --output=BedrockPassport-1.3.5-source.zip HEAD
          sha256sum build/libs/BedrockPassport-1.3.5.jar BedrockPassport-1.3.5-source.zip > BedrockPassport-1.3.5.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## BedrockPassport 1.3.5

          Fixes SkinsRestorer replacing a real Bedrock skin after the player selects a Passport identity.

          ### Fixed

          - BedrockPassport now captures the original Floodgate skin at the beginning of the skin event.
          - SkinsRestorer and other integrations may run normally afterwards.
          - At the end of the event, Passport restores the original Bedrock texture for the selected LOCAL identity.
          - Gallery/custom Bedrock skins therefore take priority over the stored SkinsRestorer skin for that join.
          - Floodgate applies the final texture to the Java-side player profile and refreshes it for other players.
          - Placeholder/default Floodgate skins are still ignored.
          - If no real Bedrock skin is supplied, the normal Java/SkinsRestorer fallback remains available.

          No authentication, UUID or JAVA_ACCOUNT behavior is changed.
          EOF

          gh release create v1.3.5 \
            build/libs/BedrockPassport-1.3.5.jar \
            BedrockPassport-1.3.5-source.zip \
            BedrockPassport-1.3.5.sha256 \
            --repo Wandraker/BedrockPassport \
            --target "${GITHUB_SHA}" \
            --title "BedrockPassport 1.3.5" \
            --notes-file release-notes.md

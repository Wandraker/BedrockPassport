name: Release BedrockPassport 1.1.0

on:
  push:
    paths:
      - '.github/workflows/release-1.1.0.yml'

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Create BedrockPassport 1.1.0 release'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release source
        uses: actions/checkout@v4
        with:
          ref: 1b5bb355f9bfead6e21bf4553c48f3435670b6b7

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: gradle clean build --stacktrace

      - name: Write release notes
        shell: bash
        run: |
          cat > "$RUNNER_TEMP/release-notes.md" <<'EOF'
          ## BedrockPassport 1.1.0

          Adds verified Java account support for online-mode servers while preserving the existing LOCAL identity flow.

          ### What's new

          - Added the `JAVA_ACCOUNT` provider for `online-mode=true`.
          - Bedrock players can authenticate real Java accounts through Microsoft/Minecraft and join with the real Java username and UUID.
          - Saved Java accounts can be reused on reconnect without repeating the device-code flow when re-authentication is not required.
          - Added AES-GCM encrypted storage for saved Java authentication chains.
          - Added automatic identity provider selection: `LOCAL` for offline-mode and `JAVA_ACCOUNT` for online-mode.
          - Added Floodgate coexistence handling for verified Java logins.
          - Preserved the existing LOCAL/Floodgate/AuthMe flow for offline-mode servers.
          EOF

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create v1.1.0 build/libs/*.jar \
            --repo "$GITHUB_REPOSITORY" \
            --target 1b5bb355f9bfead6e21bf4553c48f3435670b6b7 \
            --title "BedrockPassport 1.1.0" \
            --notes-file "$RUNNER_TEMP/release-notes.md" \
            --latest

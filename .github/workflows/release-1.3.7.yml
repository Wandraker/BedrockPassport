name: Publish BedrockPassport 1.3.7

on:
  push:
    branches:
      - main
    paths:
      - 'build.gradle.kts'
      - '.github/workflows/release-1.3.7.yml'

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Release BedrockPassport 1.3.7'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build
        run: gradle clean build --stacktrace

      - name: Prepare release assets
        run: |
          git archive --format=zip --output=BedrockPassport-1.3.7-source.zip HEAD
          sha256sum build/libs/BedrockPassport-1.3.7.jar BedrockPassport-1.3.7-source.zip > BedrockPassport-1.3.7.sha256

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          ## BedrockPassport 1.3.7

          Reworks LOCAL Bedrock skin handoff around Floodgate's confirmed uploaded skin state.

          ### Fixed

          - Removed the premature manual Geyser skin upload introduced in 1.3.6.
          - BedrockPassport now lets Geyser/Floodgate perform their native skin upload at the normal login stage.
          - After the selected Passport identity reaches Bukkit join, BedrockPassport waits for Floodgate's SKIN_UPLOADED property.
          - When the confirmed Bedrock texture arrives, BedrockPassport applies that exact signed value/signature through the public SkinsRestorer SkinApplier API.
          - The confirmed Bedrock texture therefore wins over a stored or cleared SkinsRestorer skin such as Alex.
          - Applying through SkinsRestorer also refreshes visibility for other online players.
          - If Floodgate never exposes SKIN_UPLOADED during the post-join window, BedrockPassport emits a clear warning instead of silently guessing.

          No authentication, UUID or JAVA_ACCOUNT behavior is changed.
          EOF

          gh release create v1.3.7 \
            build/libs/BedrockPassport-1.3.7.jar \
            BedrockPassport-1.3.7-source.zip \
            BedrockPassport-1.3.7.sha256 \
            --repo Wandraker/BedrockPassport \
            --target "${GITHUB_SHA}" \
            --title "BedrockPassport 1.3.7" \
            --notes-file release-notes.md

name: BedrockPassport
version: '${version}'
main: dev.onelsey.bedrockpassport.BedrockPassportPlugin
api-version: '26.2'
author: Onelsey
website: https://github.com/Wandraker/BedrockPassport
description: Persistent Java identities for Bedrock players using Geyser and Floodgate.
depend:
  - Geyser-Spigot
  - floodgate
softdepend:
  - SkinsRestorer
folia-supported: true
libraries:
  - org.xerial:sqlite-jdbc:3.50.3.0
commands:
  bedrockpassport:
    description: BedrockPassport administration
    usage: /bedrockpassport <status|reload|who>
    aliases: [bp]
    permission: bedrockpassport.admin
permissions:
  bedrockpassport.admin:
    description: Allows BedrockPassport administration commands
    default: op
